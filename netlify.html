<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上傳 HTML 網頁到 Netlify：圖解步驟</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#dde2e8;--ac:#00a39a;--wn:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a212a;--tx:#e8edf2;--mu:#98a3b1;--bd:#2d3744;--ac:#2cc9bf;--wn:#3a3216}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a212a;--tx:#e8edf2;--mu:#98a3b1;--bd:#2d3744;--ac:#2cc9bf;--wn:#3a3216}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.w{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}.sub{color:var(--mu);font-size:.9rem;margin:0 0 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:20px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.win{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:8px 0 14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.url{flex:1;margin-left:8px;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:2px 10px;font-size:.78rem;color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scr{background:#fff;display:flex;justify-content:center}
.pw{position:relative;display:inline-block;max-width:100%;line-height:0}
.pw img{display:block;max-width:100%;height:auto;max-height:72vh}
.hot{position:absolute;border-radius:50%;cursor:pointer;animation:pu 1.4s infinite;background:rgba(255,0,0,.06)}
.hot.off{animation:none;background:transparent}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(255,60,0,.65)}100%{box-shadow:0 0 0 18px rgba(255,60,0,0)}}
.bub{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#ff3c00;color:#fff;font-size:.8rem;line-height:1.3;white-space:nowrap;padding:3px 10px;border-radius:12px;font-weight:600;pointer-events:none;animation:bn 1s infinite alternate}
.hot.off .bub{display:none}
@keyframes bn{to{transform:translateX(-50%) translateY(-4px)}}
.mk{display:none;container-type:inline-size;width:min(900px,100vw - 34px);aspect-ratio:1000/340;background:#fff;color:#222;line-height:1.4;font-size:2.6cqw;position:relative}
.mk .mt{height:10%;background:#dfe3e8;padding:1.2cqw 2cqw 0}.mk .mt span{background:#fff;border-radius:1.2cqw 1.2cqw 0 0;padding:.6cqw 2cqw;font-size:2cqw}
.mk .ma{height:18%;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 3%;gap:2%}
.mk .ma>span{color:#888;width:14%;font-size:2.6cqw;white-space:nowrap}.mk .ad{flex:1;background:#eef1f5;border-radius:999px;padding:.8cqw 2.5cqw;font-size:2.4cqw;color:#8a94a0;overflow:hidden;white-space:nowrap}
.mk .ad.on{color:#222}.mk .mc{padding:5cqw;font-size:3.4cqw}
.ok{color:#fff;background:#28a745;border-radius:8px;padding:8px 12px;margin-top:10px;display:none;font-size:.9rem}
.tg{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:4px 12px;font-size:.82rem;cursor:pointer;margin-bottom:6px}
.info h2{font-size:1.1rem;margin:0 0 6px}.info p{margin:0 0 8px}
.tip{background:var(--wn);border-radius:8px;padding:8px 12px;font-size:.88rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 18px;cursor:pointer;font-size:.95rem}
.nav button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.nav button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div class="w">
<h1>上傳 HTML 網頁到 Netlify</h1>
<p class="sub">七個步驟圖解。可點紅圈、步驟標籤或鍵盤 ← → 切換；直接點圖片上的紅圈，就會跳到下一步。</p>
<div class="tabs" id="tabs"></div>
<div class="win"><div class="bar"><i></i><i></i><i></i><div class="url" id="url"></div></div><div class="scr"><div class="pw"><img id="im" alt=""><div class="mk" id="mk"><div class="mt"><span>新分頁</span></div><div class="ma"><span>←　→　⟳</span><div class="ad" id="ad"><span id="at">在此貼上網址…</span></div></div><div class="mc" id="mc"></div></div><div class="hot" id="ht"><span class="bub">👆 點這裡</span></div></div></div></div>
<button class="tg" id="tg">提示：開</button>
<div class="info" id="info"></div><div class="ok" id="ok">🎉 全部完成！你的網頁已經成功上線。</div>
<div class="nav"><button id="pv">← 上一步</button><button id="nx" class="p">下一步 →</button></div>
