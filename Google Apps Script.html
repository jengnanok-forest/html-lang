<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Apps Script 網頁部署互動式圖解教學</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Google Fonts: Noto Sans TC, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            gblue: {
              DEFAULT: '#1a73e8',
              dark: '#1557b0',
              light: '#e8f0fe',
            },
            gred: {
              DEFAULT: '#ea4335',
              light: '#fce8e6',
            },
            ggreen: {
              DEFAULT: '#1e8e3e',
              light: '#e6f4ea',
            },
          },
        },
      },
    };
  </script>

  <style>
    /* 自訂捲軸樣式，提升程式碼與模擬視窗質感 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 紅色動態高亮熱點呼吸燈效果 */
    @keyframes hotspot-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.75);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(234, 67, 53, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(234, 67, 53, 0);
      }
    }

    .hotspot-box {
      border: 2.5px solid #ea4335;
      animation: hotspot-pulse 1.8s infinite;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .hotspot-box:hover {
      transform: scale(1.02);
    }

    /* 氣泡提示微幅上下浮動動畫 */
    @keyframes float-badge {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-3px);
      }
    }
    .animate-float {
      animation: float-badge 2s ease-in-out infinite;
    }

    /* 畫面切換淡入動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col selection:bg-blue-100 selection:text-blue-900">

  <!-- ==================== 頂部導覽列與進度條 ==================== -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <!-- 品牌標題區 -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gblue text-white flex items-center justify-center shadow-sm shrink-0">
              <!-- Apps Script 火箭/程式碼圖示 -->
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
              </svg>
            </div>
            <div>
              <h1 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight leading-tight">
                Google Apps Script 網頁部署互動式圖解教學
              </h1>
              <p class="text-xs text-slate-500 hidden sm:block">
                點擊右側模擬畫面中的<span class="text-gred font-semibold">紅色動態框線</span>即可模擬操作並自動推進步驟（支援鍵盤 ← → 鍵）
              </p>
            </div>
          </div>

          <!-- 手機版快速切換按鈕 -->
          <div class="flex items-center gap-1.5 md:hidden">
            <button onclick="prevStep()" id="mobile-prev-btn" class="p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 disabled:opacity-40" aria-label="上一步">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span id="mobile-step-badge" class="text-xs font-bold px-2.5 py-1.5 rounded-lg bg-gblue-light text-gblue">1 / 6</span>
            <button onclick="nextStep()" id="mobile-next-btn" class="p-2 rounded-lg bg-gblue text-white hover:bg-gblue-dark disabled:opacity-40" aria-label="下一步">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>

        <!-- 桌面版步驟切換控制鈕 -->
        <div class="hidden md:flex items-center gap-2">
          <button onclick="prevStep()" id="desktop-prev-btn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-slate-200 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 transition disabled:opacity-40 disabled:cursor-not-allowed">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            上一步
          </button>
          <button onclick="nextStep()" id="desktop-next-btn" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-gblue text-white text-sm font-medium hover:bg-gblue-dark shadow-sm transition disabled:opacity-40 disabled:cursor-not-allowed">
            下一步
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

      <!-- 六大步驟進度導覽列 -->
      <nav aria-label="教學步驟進度" class="mt-3 pt-2.5 border-t border-slate-100">
        <div id="step-nav-container" class="grid grid-cols-6 gap-1.5 sm:gap-2">
          <!-- 由 JavaScript 動態渲染 6 個步驟按鈕 -->
        </div>
      </nav>
    </div>
  </header>

  <!-- ==================== 主內容雙欄互動區 ==================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-5 sm:py-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <!-- 左側欄：文字操作指引、注意事項與一鍵複製程式碼 (佔 5 欄) -->
      <section class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6 flex flex-col gap-5" id="left-guide-panel">
        <!-- 由 JavaScript 動態渲染當前步驟的詳細說明 -->
      </section>

      <!-- 右側欄：高擬真互動操作畫面模擬區 (佔 7 欄) -->
      <section class="lg:col-span-7 flex flex-col gap-3">
        <!-- 模擬器上方狀態控制列 -->
        <div class="flex flex-wrap items-center justify-between gap-2 bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm">
          <div class="flex items-center gap-2 text-xs sm:text-sm font-medium text-slate-700">
            <span class="inline-flex h-2.5 w-2.5 rounded-full bg-gred animate-ping"></span>
            <span id="mockup-instruction-banner">互動提示：請點擊下方畫面中紅框標示的位置</span>
          </div>
          <button onclick="resetCurrentStepInteraction()" class="inline-flex items-center gap-1 text-xs font-medium text-slate-500 hover:text-gblue px-2.5 py-1 rounded-lg hover:bg-slate-100 transition" title="重播此步驟畫面狀態">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            重播本步驟動畫
          </button>
        </div>

        <!-- 模擬瀏覽器外框容器 -->
        <div class="bg-white rounded-2xl border border-slate-300 shadow-lg overflow-hidden">
          <!-- 擬真瀏覽器頂部標籤與網址列 -->
          <div class="bg-slate-200/90 px-3 pt-2.5 pb-2 border-b border-slate-300 select-none">
            <div class="flex items-center gap-2 mb-2">
              <!-- macOS / 瀏覽器三色視窗控制點 -->
              <div class="flex items-center gap-1.5 mr-2">
                <span class="w-3 h-3 rounded-full bg-rose-400 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-emerald-400 inline-block"></span>
              </div>
              <!-- 瀏覽器分頁標籤 -->
              <div id="browser-tab-title" class="bg-white text-slate-700 text-xs font-medium px-3.5 py-1.5 rounded-t-lg shadow-sm flex items-center gap-2 max-w-[260px] truncate">
                <!-- 由 JS 動態切換分頁圖示與標題 -->
              </div>
            </div>
            <!-- 網址列 -->
            <div class="flex items-center gap-2 bg-white rounded-full px-3.5 py-1 text-xs text-slate-500 border border-slate-300/80 shadow-inner">
              <svg class="w-3.5 h-3.5 text-emerald-600 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
              <span id="browser-url-bar" class="font-mono truncate text-[11px] sm:text-xs text-slate-600">https://docs.google.com/spreadsheets/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs/edit</span>
            </div>
          </div>

          <!-- 模擬器核心畫布區（支援橫向捲動保護小螢幕不破版） -->
          <div id="mockup-canvas" class="relative bg-white min-h-[460px] sm:min-h-[500px] overflow-x-auto">
            <!-- 由 JavaScript 動態渲染 6 個步驟的互動操作畫面 -->
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- ==================== 浮動 Toast 複製成功通知 ==================== -->
  <div id="toast-notification" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2.5 text-sm font-medium">
      <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
      <span id="toast-message">已複製程式碼到剪貼簿！</span>
    </div>
  </div>

  <!-- ==================== 核心互動邏輯腳本 ==================== -->

    // 1. 常用程式碼範本定義

  return HtmlService.createHtmlOutputFromFile('index')
    .setTitle('我的網頁應用程式')

    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}`;

    h1 { color: #1a73e8; margin-bottom: 12px; }
  </style>
</head>

  </div>
</body>
</html>`;

    // 3. 應用程式狀態管理

      currentStep: 1,
      // 各步驟內部互動狀態
      step2Pasted: false,
      step3Stage: 'menu',       // 'menu' -> 'naming' -> 'cleared'
      step4Stage: 'notepad',    // 'notepad' -> 'pasted' -> 'saved'
      step5Tab: 'settings',     // 'settings' | 'auth'
      step5AuthStep: 0,         // 0: 授予存取權, 1: 進階, 2: 前往不安全, 3: 允許完成
      step6Tab: 'result',       // 'result' | 'update'
      step6PreviewOpen: false,

    // 4. 初始化渲染
    document.addEventListener('DOMContentLoaded', () => {
      renderAll();

      // 支援鍵盤左右方向鍵快速切換步驟
      document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        if (e.key === 'ArrowRight') nextStep();
        if (e.key === 'ArrowLeft') prevStep();
      });
    });

    // 5. 步驟切換函式
    function goToStep(stepNum) {
      if (stepNum < 1 || stepNum > 6) return;
      appState.currentStep = stepNum;
      renderAll();
    }

    function nextStep() {
      if (appState.currentStep < 6) {
        appState.currentStep++;
        renderAll();
      }
    }

    function prevStep() {
      if (appState.currentStep > 1) {
        appState.currentStep--;
        renderAll();
      }
    }

    // 重播當前步驟的互動初始狀態
    function resetCurrentStepInteraction() {
      const s = appState.currentStep;
      if (s === 2) appState.step2Pasted = false;
      if (s === 3) appState.step3Stage = 'menu';
      if (s === 4) appState.step4Stage = 'notepad';
      if (s === 5) {
        appState.step5Tab = 'settings';
        appState.step5AuthStep = 0;
      }
      if (s === 6) {
        appState.step6Tab = 'result';
        appState.step6PreviewOpen = false;
        appState.step6UpdateStep = 0;
      }
      renderMockup();
      showToast('已重置本步驟模擬畫面狀態');
    }

      renderNavigation();

    // 7. 渲染頂部步驟進度導覽
    function renderNavigation() {
      const container = document.getElementById('step-nav-container');
      const current = appState.currentStep;

      container.innerHTML = STEPS_DATA.map((step) => {
        const isActive = step.id === current;
        const isCompleted = step.id < current;

        let btnClass = 'bg-slate-100 text-slate-500 border-transparent hover:bg-slate-200/70';
        let badgeClass = 'bg-slate-300 text-white';

        if (isActive) {
          btnClass = 'bg-gblue-light text-gblue border-gblue/40 font-semibold shadow-sm';
          badgeClass = 'bg-gblue text-white';
        } else if (isCompleted) {
          btnClass = 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100/70';
          badgeClass = 'bg-ggreen text-white';
        }

        return `
          <button
            onclick="goToStep(${step.id})"
            class="flex items-center justify-center sm:justify-start gap-2 px-2 py-2 sm:px-3 rounded-xl border text-xs transition-all cursor-pointer ${btnClass}"
          >
            <span class="w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-bold shrink-0 ${badgeClass}">
              ${isCompleted ? '✓' : step.id}
            </span>
            <span class="hidden sm:inline truncate">${step.shortTitle}</span>
          </button>
        `;
      }).join('');

      // 更新上下一步按鈕狀態
      document.getElementById('desktop-prev-btn').disabled = current === 1;
      document.getElementById('desktop-next-btn').disabled = current === 6;
      document.getElementById('mobile-prev-btn').disabled = current === 1;
      document.getElementById('mobile-next-btn').disabled = current === 6;
      document.getElementById('mobile-step-badge').textContent = `${current} / 6`;
    }

    // ==================== 剪貼簿複製與工具函式 ====================

    // 複製步驟內的程式碼
    function copyStepCode(stepId) {
      const step = STEPS_DATA[stepId - 1];
      if (!step || !step.codeBlock) return;
      copyTextToClipboard(step.codeBlock.code, `已複製「${step.codeBlock.label}」！`);
    }

    // 使用相容於 iframe 環境的 document.execCommand('copy')
    function copyTextToClipboard(text, successMsg) {
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '0';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        if (successful) {
          showToast(successMsg || '已複製到剪貼簿！');
        }
      } catch (err) {
        console.error('複製失敗:', err);
      }
    }

    // 顯示底部浮動 Toast 訊息
    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      const msgEl = document.getElementById('toast-message');
      msgEl.textContent = message;

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2600);
    }

    // HTML 字元跳脫保護
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
