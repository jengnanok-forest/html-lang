<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>把 HTML 網頁上傳到 GitHub：互動操作圖解</title>
<style>
:root{--bg:#f3f1ec;--fg:#1f2328;--mut:#656d76;--card:#fff;--line:#d0d7de;--hot:#e8590c;--grn:#1f883d;--blu:#0969da;--sub:#f6f8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e6edf3;--mut:#8d96a0;--card:#0d1117;--line:#30363d;--hot:#ff8a3d;--grn:#2ea043;--blu:#58a6ff;--sub:#161b22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e6edf3;--mut:#8d96a0;--card:#0d1117;--line:#30363d;--hot:#ff8a3d;--grn:#2ea043;--blu:#58a6ff;--sub:#161b22;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{max-width:1120px;margin:0 auto;padding:28px 20px 8px}
h1{font-size:clamp(24px,4vw,36px);line-height:1.25;margin:0 0 6px;letter-spacing:.02em}
header p{margin:0;color:var(--mut);max-width:60ch}
.bar{max-width:1120px;margin:16px auto 0;padding:0 20px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--hot);transition:width .35s}
main{max-width:1120px;margin:16px auto 48px;padding:0 20px;display:grid;grid-template-columns:230px 1fr;gap:24px}
nav ol{list-style:none;margin:0;padding:0;position:sticky;top:16px}
nav li button{width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--line);padding:9px 12px;font:inherit;font-size:14px;color:var(--mut);cursor:pointer;line-height:1.4}
nav li button:hover{color:var(--fg)}
nav li.on button{border-color:var(--hot);color:var(--fg);font-weight:700}
nav li.done button{border-color:var(--grn)}
nav li.done button::after{content:" ✓";color:var(--grn)}
button:focus-visible,a:focus-visible,input:focus-visible,.hot:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.cap h2{font-size:22px;margin:0 0 4px}
.cap p{margin:4px 0;max-width:68ch}
.tip{margin:10px 0 14px;padding:10px 14px;background:var(--card);border-left:4px solid var(--hot);font-size:14px;color:var(--mut)}
.frame{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--sub);border-bottom:1px solid var(--line)}
.top b{width:10px;height:10px;border-radius:50%;background:var(--line)}
.url{flex:1;margin-left:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 12px;font-size:12px;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.shot{position:relative;line-height:0}.shot img{width:100%;height:auto;display:block}.shot .hot{position:absolute;background:rgba(232,89,12,.1);outline-offset:1px}.hot.lab{outline:none;animation:none;background:none}.hot.b::after{top:auto;bottom:-22px}
.scr{padding:0;min-height:340px;font-size:13px;line-height:1.5;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
.gh{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#161b22;color:#fff;position:relative}
.gh .logo{width:26px;height:26px;border-radius:50%;background:#fff}
.gh .s{flex:1;max-width:220px;border:1px solid #444c56;border-radius:6px;padding:3px 10px;color:#9198a1;font-size:12px}
.gh .pl{margin-left:auto;border:1px solid #444c56;border-radius:6px;padding:1px 10px;font-size:16px;background:none;color:#fff;font-family:inherit}
.gh .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444)}
.pad{padding:18px 22px}
.menu{position:absolute;right:50px;top:44px;width:200px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;z-index:2}
.menu div{padding:6px 10px;border-radius:5px}
.hot{position:relative;cursor:pointer;outline:2px solid var(--hot);outline-offset:2px;border-radius:6px;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,89,12,.55)}70%{box-shadow:0 0 0 10px rgba(232,89,12,0)}100%{box-shadow:0 0 0 0 rgba(232,89,12,0)}}
.hot::after{content:"點這裡";position:absolute;right:-4px;top:-22px;background:var(--hot);color:#fff;font-size:11px;padding:0 7px;border-radius:9px;white-space:nowrap;line-height:18px;z-index:3}
@media (prefers-reduced-motion:reduce){.hot{animation:none}.prog i{transition:none}}
.btn{display:inline-block;padding:5px 14px;border-radius:6px;border:1px solid var(--line);background:var(--sub);font:inherit;font-weight:600;color:var(--fg)}
.btn.g{background:var(--grn);border-color:transparent;color:#fff}
.in{display:block;width:100%;max-width:340px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit;margin:4px 0 12px}
.lnk{color:var(--blu)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:40px 16px;text-align:center;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-top:0}
.row:first-child{border-top:1px solid var(--line);background:var(--sub);border-radius:6px 6px 0 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px;background:var(--sub);flex-wrap:wrap}
.tabs span{padding:8px 12px}
.tabs .cur{border-bottom:2px solid var(--hot);font-weight:700}
.side{display:grid;grid-template-columns:150px 1fr}
.side aside{border-right:1px solid var(--line);padding:12px;color:var(--mut)}
.side aside div{padding:5px 8px;border-radius:6px}
.side aside .cur{background:var(--sub);color:var(--fg);font-weight:700}
.ok{padding:12px 14px;border:1px solid var(--grn);border-radius:8px;background:color-mix(in srgb,var(--grn) 12%,transparent);margin-bottom:12px}
.ctl{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.ctl button{font:inherit;padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.ctl .nx{background:var(--hot);border-color:transparent;color:#fff;font-weight:700}
.ctl button:disabled{opacity:.4;cursor:default}
.ctl small{color:var(--mut);margin-left:auto}
@media (max-width:760px){main{grid-template-columns:1fr}nav ol{display:flex;overflow-x:auto;position:static;gap:4px}nav li button{border-left:0;border-bottom:3px solid var(--line);white-space:nowrap;padding:6px 10px}nav li.on button{border-color:var(--hot)}.side{grid-template-columns:1fr}.side aside{display:none}.menu{right:10px}}
</style>
</head>
<body>
<header>
<h1>把做好的 HTML 網頁上傳到 GitHub</h1>
<p>跟著 8 個步驟操作。畫面為真實操作截圖，橘色閃爍處就是要點的地方；也可以用鍵盤 ← → 切換。</p>
</header>
<div class="bar"><div class="prog"><i id="pg"></i></div></div>
<main>
<nav aria-label="步驟"><ol id="nav"></ol></nav>
<section>
<div class="cap"><h2 id="t"></h2><p id="d"></p><div class="tip" id="tip"></div></div>
<div class="frame"><div class="top"><b></b><b></b><b></b><div class="url" id="url"></div></div><div class="scr" id="scr"></div></div>
<div class="ctl"><button id="pv">上一步</button><button class="nx" id="nx">下一步</button><small id="cnt"></small></div>
</section>
</main>

{t:'登入 GitHub，點「+」→「新倉庫」',d:'登入 github.com 後，點右上角的「+」，在下拉選單中選擇「新倉庫」（英文介面為 New repository）。倉庫就是放你網頁檔案的資料夾。',tip:'若你的介面是英文，選單項目會顯示 New repository。',url:'github.com',m:function(){return S(0,'left:68.78%;top:21.95%;width:27.62%;height:7.98%',"")}},
{t:'輸入倉庫名稱並建立',d:'在「倉庫名稱」欄位輸入英文名稱，例如 newtest1。「選擇可見性」請保持「民眾」（Public），才能用 GitHub Pages 免費架站。其他選項可保持預設，最後按右下角綠色的「建立儲存庫」。',tip:'名稱建議用小寫英文與連字號，避免空格與中文。',url:'github.com/new',m:function(){return S(1,'left:82.60%;top:93.02%;width:13.12%;height:4.92%',"")}},

  $('scr').innerHTML=s.m();
  $('pg').style.width=((i+1)/steps.length*100)+'%';
  $('cnt').textContent=(i+1)+' / '+steps.length;
  $('pv').disabled=i===0;
  $('nx').textContent=i===steps.length-1?'完成 🎉':'下一步';
  Array.prototype.forEach.call(nav.children,function(li,k){li.className=(k===i?'on ':'')+(k<i?'done':'')});
  Array.prototype.forEach.call(document.querySelectorAll('[data-sub]'),function(e){e.tabIndex=0;e.setAttribute('role','button');e.onclick=function(){e.style.display='none'};e.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();e.style.display='none'}}});
  var h=document.querySelectorAll('[data-go]');
  Array.prototype.forEach.call(h,function(e){e.tabIndex=0;e.setAttribute('role','button');e.onclick=function(){go(cur+1)};e.onkeydown=function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go(cur+1)}}});
  try{if(location.hash!=='#step'+(i+1))history.replaceState(null,'','#step'+(i+1))}catch(e){}
}
$('pv').onclick=function(){go(cur-1)};
$('nx').onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
function fromHash(){var m=/^#step(\d+)$/.exec(location.hash);go(m?Math.min(+m[1],steps.length)-1:0)}
window.addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
</html>
